<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currency Exchange Board</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Manrope:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body class="night-mode">

  <div class="board-casing">

    <!-- ===================== HEADER ===================== -->
    <header class="board-header">
      <h1>Currency Exchange</h1>

      <div class="header-right">
        <span class="live-dot" title="Live rates"></span>
        <span class="live-label">live rate</span>

        <!-- Day / Night power switch -->
        <label class="power-switch" title="Toggle Day / Night board">
          <input type="checkbox" id="themeToggle" />
          <span class="power-slider">
            <span class="power-icon">⏻</span>
          </span>
        </label>
      </div>
    </header>

    <!-- ===================== PINNED PAIRS ===================== -->
    <section class="pinned-row">
      <span class="pinned-label">★ Pinned:</span>
      <div id="pinnedChips" class="pinned-chips"></div>
      <button id="pinCurrentBtn" class="pin-btn" title="Pin current pair">
        + pin current
      </button>
    </section>

    <!-- ===================== CONVERTER PANEL ===================== -->
    <section class="converter-panel">

      <div class="currency-block">
        <label for="fromAmount">Amount</label>
        <input
          type="number"
          id="fromAmount"
          value="100"
          min="0"
          step="any"
        />

        <label for="fromCurrency">From</label>
        <input
          type="text"
          id="fromCurrency"
          list="currencyList"
          value="USD — US Dollar"
          autocomplete="off"
        />

        <div class="quick-chips">
          <button class="chip" data-amount="100">100</button>
          <button class="chip" data-amount="1000">1,000</button>
          <button class="chip" data-amount="10000">10,000</button>
        </div>
      </div>

      <button id="swapBtn" class="swap-btn" title="Swap currencies">⇄</button>

      <div class="currency-block">
        <label for="toCurrency">To</label>
        <input
          type="text"
          id="toCurrency"
          list="currencyList"
          value="EUR — Euro"
          autocomplete="off"
        />
      </div>

      <datalist id="currencyList"></datalist>
    </section>

    <!-- ===================== STATUS ===================== -->
    <p id="statusMessage" class="status-message"></p>

    <!-- ===================== FLIP BOARD ===================== -->
    <section class="flip-board-section">
      <div id="flipBoard" class="flip-board"></div>

      <div class="board-side">
        <span id="toCurrencyLabel" class="currency-code-label">EUR</span>
        <button id="copyBtn" class="copy-btn" title="Copy result">📋</button>
      </div>
    </section>

    <!-- ===================== TREND ===================== -->
    <section class="trend-section">
      <span class="trend-title">7-day trend</span>
      <svg id="sparkline" class="sparkline" viewBox="0 0 200 40" preserveAspectRatio="none"></svg>
      <span id="trendChange" class="trend-change">—</span>
    </section>

  </div>

  <!-- ===================== FOOTER ===================== -->
  <footer class="app-footer">
    <p>Designed &amp; Built by <strong>Simeon A. Tarr</strong></p>
    <div class="footer-links">
      <a href="#" target="_blank" rel="noopener noreferrer" title="GitHub">GitHub</a>
      <a href="#" target="_blank" rel="noopener noreferrer" title="LinkedIn">LinkedIn</a>
      <a href="#" target="_blank" rel="noopener noreferrer" title="Portfolio">Portfolio</a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
