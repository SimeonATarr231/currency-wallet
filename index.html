<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currency Wallet</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500;700&family=Manrope:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />

  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="night-mode">

  <div class="page">

    <!-- HEADER -->
    <header class="page-header">
      <div class="brand">
        <i data-lucide="wallet" class="brand-icon"></i>
        <h1>Currency Wallet</h1>
      </div>

      <div class="header-right">
        <span class="live-indicator">
          <span class="live-dot"></span>
          <span id="lastUpdated" class="live-label">connecting…</span>
        </span>

        <button id="themeToggle" class="theme-toggle" title="Toggle Day / Night" aria-label="Toggle theme">
          <i data-lucide="sun" class="icon-sun"></i>
          <i data-lucide="moon" class="icon-moon"></i>
        </button>
      </div>
    </header>

    <!-- ERROR BANNER -->
    <div id="errorBanner" class="error-banner" hidden>
      <i data-lucide="alert-triangle"></i>
      <span id="errorText">Something went wrong.</span>
      <button id="retryBtn" class="retry-btn">
        <i data-lucide="refresh-cw"></i>
        <span>Retry</span>
      </button>
    </div>

    <!-- PINNED LOYALTY CHIPS -->
    <section class="pinned-row">
      <span class="pinned-label">
        <i data-lucide="star"></i>
        Pinned
      </span>
      <div id="pinnedChips" class="pinned-chips"></div>
      <button id="pinCurrentBtn" class="pin-btn" title="Pin current pair">
        <i data-lucide="plus"></i>
        <span>Pin current</span>
      </button>
    </section>

    <!-- WALLET: CARD + TICKET -->
    <section class="wallet">

      <!-- ---------- FROM: DEBIT CARD ---------- -->
      <div class="debit-card">
        <div class="card-top-row">
          <div class="card-chip"></div>
          <i data-lucide="credit-card" class="card-brand-icon"></i>
        </div>

        <label for="fromAmount" class="card-field-label">Amount</label>
        <input
          type="number"
          id="fromAmount"
          class="card-amount-input"
          value="100"
          min="0"
          step="any"
          inputmode="decimal"
        />

        <label for="fromCurrency" class="card-field-label">Currency</label>
        <div class="input-with-icon on-card">
          <i data-lucide="search"></i>
          <input
            type="text"
            id="fromCurrency"
            list="currencyList"
            value="USD — US Dollar"
            autocomplete="off"
          />
        </div>

        <div class="quick-chips">
          <button class="chip" data-amount="100">100</button>
          <button class="chip" data-amount="1000">1,000</button>
          <button class="chip" data-amount="10000">10,000</button>
        </div>

        <div class="card-code-watermark" id="fromCurrencyLabel">USD</div>
      </div>

      <!-- SWAP CLASP -->
      <button id="swapBtn" class="swap-clasp" title="Swap currencies" aria-label="Swap currencies">
        <i data-lucide="arrow-left-right"></i>
      </button>

      <!-- TO: BOARDING PASS TICKET -->
      <div class="ticket">
        <div class="ticket-main">
          <div class="ticket-row">
            <span class="ticket-eyebrow">
              <i data-lucide="ticket"></i>
              Converted
            </span>
            <button id="copyBtn" class="icon-btn" title="Copy result" aria-label="Copy result">
              <i data-lucide="copy"></i>
            </button>
          </div>

          <label for="toCurrency" class="card-field-label ticket-label">To</label>
          <div class="input-with-icon on-ticket">
            <i data-lucide="search"></i>
            <input
              type="text"
              id="toCurrency"
              list="currencyList"
              value="EUR — Euro"
              autocomplete="off"
            />
          </div>

          <div class="ticket-amount-row">
            <span id="resultAmount" class="ticket-amount">0.00</span>
            <span id="toCurrencyLabel" class="ticket-currency-code">EUR</span>
          </div>

          <p id="statusMessage" class="status-message"></p>
        </div>

        <div class="ticket-perforation" aria-hidden="true"></div>

        <div class="ticket-stub">
          <div class="barcode" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
      </div>

      <datalist id="currencyList"></datalist>
    </section>

    <!-- TREND RECEIPT STRIP -->
    <section class="receipt-strip">
      <span class="receipt-title">
        <i data-lucide="activity"></i>
        7-day trend
      </span>
      <svg id="sparkline" class="sparkline" viewBox="0 0 200 40" preserveAspectRatio="none"></svg>
      <span id="trendChange" class="trend-change">
        <i data-lucide="minus"></i>
        <span id="trendChangeValue">—</span>
      </span>
    </section>

  </div>

  <!-- FOOTER -->
  <footer class="app-footer">
    <p>Designed &amp; Built by <strong>Simeon A. Tarr</strong></p>
    <div class="footer-links">
      <a href="https://github.com/SimeonATarr231" target="_blank" rel="noopener noreferrer" title="GitHub">
        <i data-lucide="github"></i>
      </a>
      <a href="https://www.linkedin.com/in/simeon-a-tarr-0745bb339/" target="_blank" rel="noopener noreferrer" title="LinkedIn">
        <i data-lucide="linkedin"></i>
      </a>
      <a href="https://www.facebook.com/simmeek.simmeek" target="_blank" rel="noopener noreferrer" title="Facebook">
        <i data-lucide="globe"></i>
      </a>
    </div>
  </footer>

  <script src="script.js"></script>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
